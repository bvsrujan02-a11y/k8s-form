apiVersion: v1
kind: Namespace
metadata:
  name: form-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: form-web
  namespace: form-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: form-web
  template:
    metadata:
      labels:
        app: form-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: frontend
              mountPath: /usr/share/nginx/html
      volumes:
        - name: frontend
          configMap:
            name: form-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: form-web
  namespace: form-demo
spec:
  selector:
    app: form-web
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
